# Planner assumptions per study unit (a syllabus cluster). Editable: the planner reads this file.
#
# hours   - focused hours for a BTech CS student to go from scratch to ~86% mastery of the unit,
#           including worked examples and topic-wise practice (the learning-curve time constant
#           is hours / 2, because 1 - e^-2 = 0.86). These are editorial estimates, not data.
# prereqs - units that should be finished before this one starts (only enforced when both
#           units receive study time in a plan).

