# Curated split of the official GATE syllabus into taggable items.
#
# Rules (enforced by `python -m gate_atlas build`):
#   * every `source` is copied verbatim from the official syllabus PDF (canonical edition 2027);
#   * parts are listed in official order; `heading` parts are official sub-headings, not items;
#   * together the parts must cover the whole official section text, leaving only punctuation
#     and the word "and" uncovered.
# `label` and `cluster` are editorial (for readability and roll-up analysis), never official.

[paper.DA]
title = "Data Science and Artificial Intelligence"

