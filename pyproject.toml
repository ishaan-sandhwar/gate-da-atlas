[project]
name = "gate-da-atlas"
version = "0.2.0"
description = "Open, syllabus-tagged dataset of GATE DA previous-year questions, with analysis and a study planner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
ml = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
]
llm = [
    "groq>=0.30",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8",
    "gate-da-atlas[ml,llm]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
